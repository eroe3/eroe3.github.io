<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Ethan Roe's Ethereal Raven | ITIS3135 | Home</title>
		<link rel="icon" href="images/cliffethan.jpg">
		<script src="https://divonbriesen.github.io/teaching/tools/standards-check.js" defer></script>
		<style>
			/* White supports readability; navy, blue, teal, and pale blue provide contrast. */
			* {
				box-sizing: border-box;
			}

			html {
				background: #dbeaf5;
			}

			body {
				max-width: 1000px;
				min-height: 100vh;
				margin: 0 auto;
				padding: 0 2rem 2rem;
				background-color: #f4faff;
				color: #17324d;
				font-family: Arial, Helvetica, sans-serif;
				line-height: 1.6;
				text-align: center;
				box-shadow: 0 0 24px rgba(23, 50, 77, 0.15);
			}

			header {
				margin: 0 -2rem;
				padding: 1.5rem 2rem;
				background: #17324d;
				color: white;
				border-bottom: 5px solid #49a6c8;
			}

			h1 {
				margin: 0;
				font-family: Georgia, "Times New Roman", serif;
				font-size: clamp(1.5rem, 4vw, 2.25rem);
				line-height: 1.3;
			}

			h2 {
				color: #174f73;
				font-family: Georgia, "Times New Roman", serif;
			}

			header p {
				margin-bottom: 0;
				color: #c6e6f3;
			}

			p {
				max-width: 820px;
				margin: 1.1rem auto;
			}

			nav {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 0.65rem;
				max-width: none;
				margin: 0 -2rem 2rem;
				padding: 0.85rem 1rem;
				background: #c6e6f3;
				border-bottom: 1px solid #91c8dc;
			}

			a {
				color: #075985;
				font-weight: 700;
				text-underline-offset: 0.2em;
			}

			a:hover,
			a:focus-visible {
				color: #9a4f00;
			}

			main img {
				width: 110px;
				height: 110px;
				object-fit: contain;
				border-radius: 18px;
				box-shadow: 0 6px 16px rgba(23, 50, 77, 0.2);
			}

			footer {
				margin-top: 2rem;
				padding-top: 1rem;
				border-top: 1px solid #91c8dc;
			}

			@media (max-width: 600px) {
				body {
					padding: 0 1.25rem 1.5rem;
				}

				header,
				nav {
					margin-right: -1.25rem;
					margin-left: -1.25rem;
				}
			}
		</style>
		<script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
	</head>
	<body>
		<!-- Shared course header and navigation are loaded from the components folder. -->
		<div data-include="components/header.html"></div>
		<main>
			<h2>Home</h2>
			<img src="images/roedigital.png" alt="Roe Digital logo">
			<p>Welcome to my webpage for ITIS3135.</p>
		</main>
		<!-- Shared course footer is loaded from the components folder. -->
		<div data-include="components/footer.html"></div>
		<script src="scripts/HTMLInclude.min.js"></script>
	</body>
</html>
